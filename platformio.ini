; PlatformIO Project Configuration File
;
; y_automation - FreeRTOS GPIO automation firmware for the ESP32-C3.
;
; Two environments are provided because the ESP32-C3-DevKitM-1 offers two
; different "USB serial" paths.  Both speak the identical line protocol.
;
;   esp32-c3-devkitm-1 : UART0 through the on-board USB-to-UART bridge.
;                        This is the default and works out of the box.
;   esp32-c3-usbcdc    : native USB Serial/JTAG peripheral on GPIO18/GPIO19.
;                        Use it when the board is cabled straight to the SoC.
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-c3-devkitm-1

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter, time
; Scoped to this project's sources on purpose: the ESP-IDF headers are noisy
; under -Wextra and are not ours to fix.
build_src_flags =
	-Wall
	-Wextra

[env:esp32-c3-devkitm-1]
build_flags =
	-D ARDUINO_USB_CDC_ON_BOOT=0

[env:esp32-c3-usbcdc]
build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
