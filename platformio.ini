; PlatformIO Project Configuration File
;
; y_automation - GPIO automation firmware.
;
; Supported targets:
;
;   ESP32-C3 (default)
;   esp32-c3-devkitm-1 : UART0 through the on-board USB-to-UART bridge.
;   esp32-c3-usbcdc    : native USB Serial/JTAG on GPIO18/GPIO19.
;
;   ESP32
;   esp32-devkitc      : UART0 through the USB-to-UART bridge (CP210x/CH340).
;
;   ESP32-S3
;   esp32-s3-devkitc-1 : UART0 through the on-board USB-to-UART bridge.
;   esp32-s3-usbcdc    : native USB Serial/JTAG (USB vendor id 303A).
;
;   Raspberry Pi Pico / Pico2
;   rpi-pico           : Raspberry Pi Pico (RP2040) – USB CDC serial.
;   rpi-pico2          : Raspberry Pi Pico 2 (RP2350) – USB CDC serial.
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-c3-devkitm-1

; ---------------------------------------------------------------------------
; Shared ESP32 base (all Espressif targets)
; ---------------------------------------------------------------------------
[espressif_base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter, time
; Scoped to this project's sources on purpose: the ESP-IDF headers are noisy
; under -Wextra and are not ours to fix.
build_src_flags =
	-Wall
	-Wextra

; ---------------------------------------------------------------------------
; Shared RP2040/RP2350 base (Raspberry Pi Pico targets)
; ---------------------------------------------------------------------------
[rp2_base]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board_build.core = earlephilhower
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter, time
build_src_flags =
	-Wall
	-Wextra

; ---------------------------------------------------------------------------
; ESP32-C3
; ---------------------------------------------------------------------------
[env:esp32-c3-devkitm-1]
extends = espressif_base
board = esp32-c3-devkitm-1
build_flags =
	-D ARDUINO_USB_CDC_ON_BOOT=0

[env:esp32-c3-usbcdc]
extends = espressif_base
board = esp32-c3-devkitm-1
build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D Y_PIN_MASK=0x003007FFUL


; ---------------------------------------------------------------------------
; ESP32 (original Xtensa dual-core, 34 usable GPIOs)
; GPIO mask: GPIO0..GPIO19, GPIO21..GPIO23, GPIO25..GPIO27, GPIO32..GPIO33
; GPIO34..GPIO39 are input-only so excluded.  GPIO6..GPIO11 are flash.
; Safe general-purpose outputs: GPIO0..5, GPIO12..GPIO19, GPIO21..GPIO23,
; GPIO25..GPIO27, GPIO32..GPIO33.
; ---------------------------------------------------------------------------
[env:esp32-devkitc]
extends = espressif_base
board = esp32dev
build_flags =
	-D ARDUINO_USB_CDC_ON_BOOT=0
	-D Y_MAX_PINS=40
	-D Y_PIN_MASK=0x2FFE333FUL
	-D Y_LEDC_CHANNELS=16
	-D Y_LEDC_SRC_HZ=80000000UL

; ---------------------------------------------------------------------------
; ESP32-S3 (Xtensa dual-core, 45 usable GPIOs)
; GPIO0..GPIO21 are safe for general use; GPIO22..GPIO37 are strapping/reserved
; on most modules.  GPIO18/GPIO19 are USB D-/D+ on the native USB build.
; Default mask: GPIO0..GPIO21 minus the SPI flash range (GPIO26..GPIO32 on
; Octal-flash variants, none on UART-flash variants — use a per-board override
; via -D Y_PIN_MASK if needed).
; ---------------------------------------------------------------------------
[env:esp32-s3-devkitc-1]
extends = espressif_base
board = esp32-s3-devkitc-1
build_flags =
	-D ARDUINO_USB_CDC_ON_BOOT=0
	-D Y_MAX_PINS=45
	-D Y_PIN_MASK=0x1FFFFFUL
	-D Y_LEDC_CHANNELS=8
	-D Y_LEDC_SRC_HZ=80000000UL

[env:esp32-s3-usbcdc]
extends = espressif_base
board = esp32-s3-devkitc-1
build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D Y_MAX_PINS=45
	-D Y_PIN_MASK=0x1FFFFFUL
	-D Y_LEDC_CHANNELS=8
	-D Y_LEDC_SRC_HZ=80000000UL

; ---------------------------------------------------------------------------
; Raspberry Pi Pico (RP2040) — GPIO0..GPIO28 (29 pins)
; ---------------------------------------------------------------------------
[env:rpi-pico]
extends = rp2_base
board = pico
build_flags =
	-D Y_MAX_PINS=29
	-D Y_PIN_MASK=0x1FFFFFFFUL

; ---------------------------------------------------------------------------
; Raspberry Pi Pico 2 (RP2350) — GPIO0..GPIO28 (29 pins)
; ---------------------------------------------------------------------------
[env:rpi-pico2]
extends = rp2_base
board = rpipico2
build_flags =
	-D Y_MAX_PINS=29
	-D Y_PIN_MASK=0x1FFFFFFFUL
