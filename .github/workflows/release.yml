name: Release

# Push a version tag to cut a release:
#
#   1. bump FW_VERSION in include/config.h
#   2. git commit -am "Release 1.1.0"
#   3. git tag -a v1.1.0 -m "v1.1.0" && git push origin main --follow-tags
#
# The tag must match FW_VERSION, otherwise the build is failed on purpose so a
# binary can never report a version different from the release it ships in.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build and release, e.g. v1.0.0'
        required: true

permissions:
  contents: write

env:
  ENVIRONMENTS: esp32-c3-devkitm-1 esp32-c3-usbcdc esp32-devkitc esp32-s3-devkitc-1 esp32-s3-usbcdc rpi-pico rpi-pico2

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve the version
        id: version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (version $version)"

      - name: Verify the tag matches FW_VERSION
        run: |
          fw=$(sed -n 's/^#define FW_VERSION "\([^"]*\)".*/\1/p' include/config.h)
          want="${{ steps.version.outputs.version }}"
          echo "include/config.h -> $fw"
          echo "tag              -> $want"
          if [ -z "$fw" ]; then
            echo "::error::Could not read FW_VERSION from include/config.h"
            exit 1
          fi
          if [ "$fw" != "$want" ]; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} does not match FW_VERSION \"$fw\". Bump include/config.h and re-tag."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: |
          set -euo pipefail
          for env_name in $ENVIRONMENTS; do
            echo "::group::$env_name"
            pio run -e "$env_name"
            echo "::endgroup::"
          done

      - name: Package artifacts
        id: package
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          root="$PWD"
          rm -rf dist stage
          mkdir -p dist stage

          take() {  # take <name in .pio/build> <name inside the zip>
            if [ -f "$build/$1" ]; then
              cp "$build/$1" "$stage/$2"
            else
              echo "note: $build/$1 was not produced, skipping"
            fi
          }

          flash_notes() {  # flash_notes <destination>
          case "$env_name" in
            rpi-pico|rpi-pico2)
          cat > "$1" <<EOF
          y_automation $version - $env_name

          Flash with picotool or drag-and-drop:

            picotool load -f firmware.uf2

          Or hold BOOTSEL while plugging in the board, then copy firmware.uf2
          to the USB mass-storage drive that appears.

          firmware.elf carries the debug symbols; keep it if you need to decode
          a crash backtrace.

          This archive is the "$env_name" build:
            rpi-pico   Raspberry Pi Pico  (RP2040)
            rpi-pico2  Raspberry Pi Pico 2 (RP2350)
          EOF
            ;;
            *)
          cat > "$1" <<EOF
          y_automation $version - $env_name

          Flash a blank chip (bootloader, partition table and app in one image):

            esptool --port <PORT> write-flash 0x0 factory.bin

          Update just the application, keeping the bootloader in place:

            esptool --port <PORT> write-flash 0x10000 firmware.bin

          factory.bin is the reliable path. bootloader.bin (0x0) and
          partitions.bin (0x8000) are included for piecemeal flashing, but note
          that a from-scratch manual flash also needs boot_app0.bin at 0xe000,
          which ships with the ESP32 Arduino core rather than this release.

          firmware.elf carries the debug symbols; keep it if you need to decode a
          crash backtrace.

          This archive is the "$env_name" build:
            esp32-c3-devkitm-1   ESP32-C3 – UART0 through the USB-to-UART bridge
            esp32-c3-usbcdc      ESP32-C3 – native USB Serial/JTAG (VID 303A)
            esp32-devkitc        ESP32 – UART0 through the USB-to-UART bridge
            esp32-s3-devkitc-1   ESP32-S3 – UART0 through the USB-to-UART bridge
            esp32-s3-usbcdc      ESP32-S3 – native USB Serial/JTAG (VID 303A)
          EOF
            ;;
          esac
          }

          for env_name in $ENVIRONMENTS; do
            build=".pio/build/$env_name"
            stage="stage/$env_name"
            mkdir -p "$stage"

            take firmware.bin         firmware.bin
            take firmware.elf         firmware.elf
            case "$env_name" in
              rpi-pico|rpi-pico2)
                take firmware.uf2     firmware.uf2
                ;;
              *)
                take firmware.factory.bin factory.bin
                take bootloader.bin       bootloader.bin
                take partitions.bin       partitions.bin
                ;;
            esac
            flash_notes "$stage/FLASH.txt"

            # One grab-and-flash archive per environment.  python -m zipfile
            # keeps this runnable anywhere, without depending on the `zip` tool.
            ( cd "$stage" && python -m zipfile -c \
                "$root/dist/y_automation-$version-$env_name-firmware.zip" . )
          done

          # The desktop app ships with the release so a binary and its control
          # panel are always the same vintage.
          mkdir -p stage/studio
          cp -r app stage/studio/app
          rm -rf stage/studio/app/__pycache__
          find stage/studio/app -name '*.pyc' -delete
          ( cd stage/studio && python -m zipfile -c \
              "$root/dist/y_automation-$version-studio.zip" app )

          cd dist
          sha256sum y_automation-* > SHA256SUMS.txt
          ls -la

      - name: Write release notes
        run: |
          version="${{ steps.version.outputs.version }}"
          cat > NOTES.md <<EOF
          GPIO automation firmware for ESP32 and Raspberry Pi Pico families,
          plus the \`y_automation studio\` desktop app.

          ## Which firmware do I need?

          Download one archive:

          | Archive | Board | Connection |
          | --- | --- | --- |
          | \`y_automation-$version-esp32-c3-devkitm-1-firmware.zip\` | ESP32-C3 | USB-to-UART bridge (CP210x) |
          | \`y_automation-$version-esp32-c3-usbcdc-firmware.zip\` | ESP32-C3 | native USB Serial/JTAG (VID 303A) |
          | \`y_automation-$version-esp32-devkitc-firmware.zip\` | ESP32 | USB-to-UART bridge |
          | \`y_automation-$version-esp32-s3-devkitc-1-firmware.zip\` | ESP32-S3 | USB-to-UART bridge |
          | \`y_automation-$version-esp32-s3-usbcdc-firmware.zip\` | ESP32-S3 | native USB Serial/JTAG (VID 303A) |
          | \`y_automation-$version-rpi-pico-firmware.zip\` | Raspberry Pi Pico (RP2040) | USB CDC |
          | \`y_automation-$version-rpi-pico2-firmware.zip\` | Raspberry Pi Pico 2 (RP2350) | USB CDC |

          Not sure which ESP32 variant? Check the port's USB vendor id: \`303A\` means
          native USB, anything else means the bridge. The studio app labels this for you.

          ## Flashing – ESP32 family

          \`\`\`sh
          unzip y_automation-$version-<env>-firmware.zip

          # blank chip, everything in one image
          esptool --port COM12 write-flash 0x0 factory.bin

          # application only, keeping the existing bootloader
          esptool --port COM12 write-flash 0x10000 firmware.bin
          \`\`\`

          ## Flashing – Raspberry Pi Pico / Pico 2

          \`\`\`sh
          unzip y_automation-$version-<env>-firmware.zip

          # drag-and-drop: hold BOOTSEL, plug in, copy firmware.uf2 to the drive
          # or with picotool:
          picotool load -f firmware.uf2
          \`\`\`

          ## Desktop app

          \`\`\`sh
          unzip y_automation-$version-studio.zip
          pip install -r app/requirements.txt
          python app/main.py
          \`\`\`

          Checksums are in \`SHA256SUMS.txt\`.
          EOF

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          title="y_automation ${{ steps.version.outputs.version }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            # Re-running (workflow_dispatch, or a re-pushed tag) must leave
            # exactly what this build produced, so clear the old assets first
            # instead of merging two sets of file names.
            echo "Release $tag exists, replacing its assets"
            gh release view "$tag" --json assets --jq '.assets[].name' \
              | while read -r asset; do
                  [ -n "$asset" ] || continue
                  echo "  removing $asset"
                  gh release delete-asset "$tag" "$asset" --yes
                done
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --title "$title" --notes-file NOTES.md
          else
            gh release create "$tag" dist/* \
              --title "$title" \
              --notes-file NOTES.md \
              --verify-tag
          fi
